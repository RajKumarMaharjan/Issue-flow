<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./src/style/style.css">
</head>

<body>
    <header class="app-header border-bottom">
        <div
            class="container-xxl py-4 d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div class="header-logo">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <span class="brand-mark" aria-hidden="true">IF</span>
                    <h1 class="h3 mb-0 fw-bold">IssueFlow</h1>
                </div>
                <p class="text-secondary mb-0">Secure local-first issue tracking with jQuery 4.</p>
            </div>
            <div class="btn-wrapper">
                <span id="trustedTypesStatus" class="badge text-bg-success">Trusted Type</span>
                <span id="networkStatus" class="badge text-bg-success">Network Type</span>
                <button id="newIssueButton" class="btn btn-primary" type="button">+ New issue</button>
            </div>
        </div>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="./src/JS/index.js"></script>
</body>

</html>
